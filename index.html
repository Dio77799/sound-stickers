<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#5b2eff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1240" media="(prefers-color-scheme: dark)">
  <title>Sound Stickers</title>
  <meta name="description" content="Make a WhatsApp ready sticker and the short sound that goes with it, in the browser. Nothing is uploaded.">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://dio77799.github.io/sound-stickers/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sound Stickers">
  <meta property="og:title" content="Sound Stickers: make a sticker that makes noise">
  <meta property="og:description" content="Any picture plus a short sound, ready for WhatsApp. It all happens in your browser, nothing is uploaded.">
  <meta property="og:url" content="https://dio77799.github.io/sound-stickers/">
  <meta property="og:image" content="https://dio77799.github.io/sound-stickers/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sound Stickers: a tilted sticker with a sound wave and a play button">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <svg class="logo" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M6 4h16l8 8v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff"/>
      <path d="M22 4v6a2 2 0 0 0 2 2h6" fill="#c6ff3d" stroke="#14121f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M11 17v5M15 14v11M19 16v7" stroke="#14121f" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1 data-t="title">Sound Stickers</h1>
    <p data-t="tagline"></p>
    <div class="lang">
      <button type="button" data-lang="es" aria-label="Español">ES</button>
      <button type="button" data-lang="en" aria-label="English">EN</button>
    </div>
  </header>

  <main>
    <section class="card sticker">
      <h2 data-t="step1"></h2>
      <label class="pick-image">
        <canvas id="preview" width="512" height="512" role="img" data-t-label="preview"></canvas>
        <span class="pick-hint">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          <span data-t="pickImage"></span>
        </span>
        <input id="image" type="file" accept="image/*" required title="">
      </label>
      <div class="row outline-row">
        <label class="chip"><input id="outline" type="checkbox" checked> <span data-t="outline"></span></label>
        <label class="chip grow"><span data-t="outlineWidth"></span>
          <input id="outlineWidth" type="range" min="0" max="14" value="8">
        </label>
        <label class="chip"><span data-t="outlineColor"></span>
          <input id="outlineColor" type="color" value="#ffffff">
        </label>
      </div>
    </section>

    <section class="card sound">
      <h2 data-t="step2"></h2>
      <div class="sources">
        <label class="tile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span data-t="pickAudio"></span>
          <input id="audio" type="file" accept="audio/*,video/*">
        </label>
        <p class="or" data-t="or"></p>
        <button id="record" class="tile" type="button" data-t="record"></button>
      </div>
      <div class="row trim">
        <label><span data-t="start"></span> <input id="start" type="number" min="0" step="0.1" value="0"></label>
        <label><span data-t="end"></span> <input id="end" type="number" min="0" step="0.1" value="0"></label>
        <button id="play" type="button" data-t="play" disabled></button>
      </div>
      <p class="hint"><span data-t="maxNote"></span> <span id="duration"></span></p>
    </section>

    <section class="finish">
      <h2 data-t="step3"></h2>
      <button id="build" type="button" class="primary" data-t="build"></button>
      <p id="message" role="status"></p>
      <div id="results" hidden>
        <button id="share" type="button" data-t="share" hidden></button>
        <p class="hint" id="shareNote" data-t="shareNote" hidden></p>
        <a id="dlSticker" download="sticker.webp"><span data-t="download"></span> sticker</a>
        <a id="dlSound" download="sound.wav" hidden><span data-t="download"></span> sound.wav</a>
        <audio id="soundPreview" controls hidden></audio>
      </div>
      <div class="how">
        <h3 data-t="howTo"></h3>
        <ol>
          <li data-t="how1"></li>
          <li data-t="how2"></li>
        </ol>
        <p class="hint" data-t="how3"></p>
      </div>
    </section>
  </main>

  <footer>
    <p data-t="privacy"></p>
    <p><a href="https://github.com/Dio77799/sound-stickers" data-t="source">Source code</a> · MIT</p>
  </footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
